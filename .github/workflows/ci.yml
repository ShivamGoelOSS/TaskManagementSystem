name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Lint with Checkstyle
      run: |
        curl -L https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar -o checkstyle.jar
        curl -L https://raw.githubusercontent.com/checkstyle/checkstyle/master/src/main/resources/google_checks.xml -o google_checks.xml
        java -jar checkstyle.jar -c google_checks.xml src/main/java/**/*.java || true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Run OWASP Dependency Check
      run: ./mvnw dependency-check:check || true

    - name: Run tests
      run: ./mvnw test

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Build Docker image
      run: docker build -t taskmanager:${{ github.sha }} .

    - name: Verify Docker image
      run: docker images | grep taskmanager

    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@0.20.0
      continue-on-error: true
      with:
        scan-type: 'image'
        scan-ref: 'taskmanager:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Check if Trivy results exist
      run: if [ -f trivy-results.sarif ]; then echo "trivy_exists=true" >> $GITHUB_ENV; fi
      if: always()

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: env.trivy_exists == 'true'
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Test Docker image runtime
      run: |
        docker run -d --name test-container -p 8080:8080 taskmanager:${{ github.sha }}
        sleep 30
        curl -f http://localhost:8080/api/tasks || exit 1
        docker stop test-container
        docker rm test-container

    - name: Login to DockerHub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        docker tag taskmanager:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:${{ github.sha }}
        docker tag taskmanager:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:latest