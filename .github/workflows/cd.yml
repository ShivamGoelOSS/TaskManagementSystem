name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
  workflow_dispatch:

jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION || 'us-east-1' }} --name ${{ secrets.EKS_CLUSTER_NAME || 'my-cluster' }}

    - name: Deploy to Kubernetes
      run: |
        kubectl create deployment taskmanager --image=${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:latest --dry-run=client -o yaml | kubectl apply -f -
        kubectl expose deployment taskmanager --type=LoadBalancer --port=8080 --dry-run=client -o yaml | kubectl apply -f -

    - name: Wait for deployment
      run: kubectl wait --for=condition=available --timeout=300s deployment/taskmanager

    - name: Wait for LoadBalancer
      run: |
        echo "Waiting for LoadBalancer to get external IP..."
        for i in {1..30}; do
          LB_URL=$(kubectl get svc taskmanager -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -n "$LB_URL" ] && [ "$LB_URL" != "<pending>" ]; then
            echo "LoadBalancer ready: $LB_URL"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 10
        done

    - name: Run dummy DAST
      run: |
        # Get the LoadBalancer URL
        LB_URL=$(kubectl get svc taskmanager -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        if [ -n "$LB_URL" ] && [ "$LB_URL" != "<pending>" ]; then
          echo "Testing via LoadBalancer: $LB_URL"
          curl -f --max-time 30 http://$LB_URL:8080/api/tasks || exit 1
        else
          echo "LoadBalancer not ready, using port-forward for testing"
          kubectl port-forward deployment/taskmanager 8080:8080 &
          sleep 5
          curl -f --max-time 10 http://localhost:8080/api/tasks || exit 1
        fi